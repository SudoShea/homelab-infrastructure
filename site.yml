---
- name: Deploy Rootless Podman Homelab Stack & Local Backup Automation
  hosts: homelab
  gather_facts: true
  roles:
    - podman_stack

- name: Configure Secondary Server Offsite Sync & Storage Pipeline
  hosts: storage_servers
  gather_facts: true
  tasks:
    - name: Ensure server backup destination directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/backups/pihole"
        state: directory
        mode: '0755'

    - name: Schedule nightly offsite sync to cloud storage (03:00 AM)
      ansible.builtin.cron:
        name: "Pull Pi-hole backup and sync offsite to cloud storage"
        minute: "0"
        hour: "3"
        job: >-
          rsync -az <username>@<primary_hostname>:~/backups/ {{ ansible_facts['user_dir'] }}/backups/pihole/ &&
          rclone sync {{ ansible_facts['user_dir'] }}/backups/pihole/ <cloud_remote>:<cloud_backup_path>

- name: Deploy Centralized Logging Server (Loki & Grafana)
  hosts: storage_servers
  gather_facts: true
  roles:
    - logging_server

- name: Deploy Log Shipper (Vector)
  hosts: homelab
  gather_facts: true
  roles:
    - logging_shipper
