# ==============================================================================
# File        : examples/cloud-providers/gdrive.yml
# Description : Example variables for Google Drive rclone integration
# Author      : SudoShea
# Version     : 1.8.4
# License     : MIT
# ==============================================================================
---
restic_rclone_sync_enabled: true
restic_rclone_remote_name: "gdrive-remote"
restic_rclone_type: "drive"
restic_rclone_remote_target: "gdrive-remote:HomelabBackups/restic"
restic_rclone_options:
  client_id: "{{ vault_gdrive_client_id }}"
  client_secret: "{{ vault_gdrive_client_secret }}"
  token: "{{ vault_gdrive_token }}"
  scope: "drive.file"
