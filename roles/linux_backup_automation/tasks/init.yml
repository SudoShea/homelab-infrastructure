# ==============================================================================
# File        : tasks/init.yml
# Description : Restic repository initialization and secret file management
# Author      : SudoShea
# Version     : 1.9.0
# License     : MIT
# ==============================================================================
---
- name: Ensure Restic system configuration directory exists
  ansible.builtin.file:
    path: "{{ restic_password_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Ensure backup repository parent directory exists
  ansible.builtin.file:
    path: "{{ restic_repo_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate or deploy secure local Restic password file
  ansible.builtin.copy:
    content: "{{ restic_password }}"
    dest: "{{ restic_password_file }}"
    owner: root
    group: root
    mode: '0600'
  when: restic_password | length > 0

- name: Check if Restic repository is already initialized
  ansible.builtin.command:
    cmd: "restic -r {{ restic_repo_path }} cat config"
  environment:
    RESTIC_PASSWORD_FILE: "{{ restic_password_file }}"
  register: restic_check
  failed_when: false
  changed_when: false

- name: Initialise Restic repository if missing
  ansible.builtin.command:
    cmd: "restic -r {{ restic_repo_path }} init"
  environment:
    RESTIC_PASSWORD_FILE: "{{ restic_password_file }}"
  when: restic_check.rc != 0
  changed_when: true
