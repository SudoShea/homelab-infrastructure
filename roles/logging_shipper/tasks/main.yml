# ==============================================================================
# Task        : roles/logging_shipper/tasks/main.yml
# Description : Provisioning tasks for Vector log collector container
# Author      : SudoShea
# Version     : 1.11.0
# License     : MIT
# ==============================================================================
---
- name: Ensure systemd journal directories exist on host
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/log/journal
    - /run/log/journal
  become: true

- name: Add user to systemd-journal group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: systemd-journal
    append: true
  become: true

- name: Grant user recursive access and default ACLs for journal logs
  ansible.builtin.shell: |
    setfacl -R -m u:{{ ansible_facts['user_id'] }}:rx,d:u:{{ ansible_facts['user_id'] }}:rx /var/log/journal /run/log/journal 2>/dev/null || true
    setfacl -R -m m::rx /var/log/journal /run/log/journal 2>/dev/null || true
  become: true
  changed_when: false

- name: Create Vector directory structure
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/homelab/vector"
    state: directory
    mode: '0755'

- name: Deploy Vector configuration template
  ansible.builtin.template:
    src: vector.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/homelab/vector/vector.toml"
    mode: '0644'

- name: Ensure systemd user directory exists for Quadlets
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Deploy Vector Quadlet definition
  ansible.builtin.template:
    src: vector.container.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd/vector.container"
    mode: '0644'
  register: vector_quadlet

- name: Reload systemd user daemon if Vector Quadlet changed
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: vector_quadlet.changed

- name: Ensure Vector Quadlet service is enabled and running
  ansible.builtin.systemd_service:
    name: vector
    state: started
    enabled: true
    scope: user

- name: Limit local systemd journal retention size
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?SystemMaxUse='
    line: 'SystemMaxUse=4G'
    insertafter: '^\[Journal\]'
    mode: '0644'
  become: true
  notify: Restart systemd-journald
