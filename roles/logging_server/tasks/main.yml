# ==============================================================================
# Task        : roles/logging_server/tasks/main.yml
# Description : Provisioning tasks for Grafana Loki and Grafana Dashboard with TLS
# Author      : SudoShea
# Version     : 1.11.0
# License     : MIT
# ==============================================================================
---
- name: Create Loki and Grafana volume directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ansible_facts['user_dir'] }}/homelab/loki/config", mode: '0755' }
    - { path: "{{ ansible_facts['user_dir'] }}/homelab/loki/data", mode: '0777' }
    - { path: "{{ ansible_facts['user_dir'] }}/homelab/grafana/data", mode: '0777' }
    - { path: "{{ ansible_facts['user_dir'] }}/homelab/grafana/certs", mode: '0777' }
    - { path: "{{ ansible_facts['user_dir'] }}/homelab/grafana/provisioning/dashboards", mode: '0755' }
    - { path: "{{ ansible_facts['user_dir'] }}/homelab/grafana/dashboards", mode: '0755' }

- name: Generate self-signed TLS certificate for Grafana
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 3650 -newkey rsa:2048
    -keyout {{ ansible_facts['user_dir'] }}/homelab/grafana/certs/grafana.key
    -out {{ ansible_facts['user_dir'] }}/homelab/grafana/certs/grafana.crt
    -subj "/CN=192.168.0.102/O=Homelab"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/homelab/grafana/certs/grafana.crt"

- name: Set readable permissions on Grafana TLS cert and key
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0644'
  loop:
    - "{{ ansible_facts['user_dir'] }}/homelab/grafana/certs/grafana.key"
    - "{{ ansible_facts['user_dir'] }}/homelab/grafana/certs/grafana.crt"

- name: Deploy Loki config template
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ ansible_facts['user_dir'] }}/homelab/loki/config/loki.yml"
    mode: '0644'

- name: Deploy Grafana dashboard provisioning config
  ansible.builtin.copy:
    src: files/dashboards.yml
    dest: "{{ ansible_facts['user_dir'] }}/homelab/grafana/provisioning/dashboards/dashboards.yml"
    mode: '0644'

- name: Deploy Systemd & Podman JSON dashboard
  ansible.builtin.copy:
    src: files/systemd-podman-logs.json
    dest: "{{ ansible_facts['user_dir'] }}/homelab/grafana/dashboards/systemd-podman-logs.json"
    mode: '0644'

- name: Ensure systemd user directory exists for Quadlets
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Deploy Loki Quadlet definition
  ansible.builtin.template:
    src: loki.container.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd/loki.container"
    mode: '0644'
  register: loki_quadlet

- name: Deploy Grafana Quadlet definition
  ansible.builtin.template:
    src: grafana.container.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd/grafana.container"
    mode: '0644'
  register: grafana_quadlet

- name: Reload systemd user daemon if Quadlets changed
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: loki_quadlet.changed or grafana_quadlet.changed

- name: Ensure Loki and Grafana Quadlet services are enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    scope: user
  loop:
    - loki
    - grafana
