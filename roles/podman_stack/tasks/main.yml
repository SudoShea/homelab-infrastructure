# ==============================================================================
# Role Task   : roles/podman_stack/tasks/main.yml
# Description : Provisions rootless container volumes, lingering, and Podman containers
# Author      : SudoShea
# Version     : 1.0.0
# License     : MIT
# ==============================================================================
---
- name: Ensure lingering is enabled for user container persistence
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_user }}"
  changed_when: false

- name: Create persistent volume directories for rootless stack
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_user_dir }}/homelab/pihole/etc-pihole"
    - "{{ ansible_user_dir }}/homelab/pihole/etc-dnsmasq.d"
    - "{{ ansible_user_dir }}/homelab/unbound/config"
    - "{{ ansible_user_dir }}/homelab/caddy/config"
    - "{{ ansible_user_dir }}/homelab/caddy/data"

- name: Deploy Unbound recursive DNS container
  containers.podman.podman_container:
    name: unbound
    image: docker.io/mvance/unbound:latest
    state: started
    restart_policy: always
    network: host
    volumes:
      - "{{ ansible_user_dir }}/homelab/unbound/config:/opt/unbound/etc/unbound"

- name: Deploy Pi-hole DNS container
  containers.podman.podman_container:
    name: pihole
    image: docker.io/pihole/pihole:latest
    state: started
    restart_policy: always
    network: host
    env:
      TZ: "UTC"
      FTLCONF_LOCAL_IPV4: "{{ ansible_default_ipv4.address }}"
      PIHOLE_DNS_: "127.0.0.1#5335"
    volumes:
      - "{{ ansible_user_dir }}/homelab/pihole/etc-pihole:/etc/pihole"
      - "{{ ansible_user_dir }}/homelab/pihole/etc-dnsmasq.d:/etc/dnsmasq.d"

- name: Deploy Caddy reverse proxy container
  containers.podman.podman_container:
    name: caddy
    image: docker.io/library/caddy:latest
    state: started
    restart_policy: always
    network: host
    volumes:
      - "{{ ansible_user_dir }}/homelab/caddy/config:/etc/caddy"
      - "{{ ansible_user_dir }}/homelab/caddy/data:/data"
